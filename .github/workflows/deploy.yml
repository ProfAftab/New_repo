name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inspect Workspace Files
        run: |
          echo "Files in GitHub runner root:"
          ls -la

      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Verify EC2 Connection and Remote rsync
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "which rsync && sudo mkdir -p /var/www/html && sudo chown -R deploy:apache /var/www/html"

      - name: Sync Static Files to /var/www/html
        run: |
          rsync -avzvv --delete \
            --exclude '.git*' \
            --exclude '.github' \
            ./ ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/var/www/html/

      - name: Reload Web Server
        run: |
          ssh ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} "sudo /usr/bin/systemctl reload httpd"